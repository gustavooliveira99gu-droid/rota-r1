<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E5B4B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Checklist">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231E5B4B'/><path d='M28 52l16 16 28-34' fill='none' stroke='white' stroke-width='10' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}[hidden]{display:none!important}img{max-width:100%}</style>
<script>try{var t=localStorage.getItem('rota-r1-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<title>Checklist da aprovação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --surface-2:#F6F8F7; --line:#D7DFDC; --line-2:#E6ECE9;
  --ink:#13201D; --ink-2:#3C4B47; --muted:#66756F;
  --accent:#1E5B4B; --accent-ink:#FFFFFF; --accent-soft:#DDEBE5;
  --iodine:#A8661A; --iodine-soft:#F6E9D6;
  --good:#2C7F52; --good-soft:#DCEFE3; --warn:#9A6A0B; --warn-soft:#F7EBCB; --crit:#B23A32; --crit-soft:#F8E0DD;
  --a-CIR:#1E5B4B; --a-CM:#3B5C99; --a-PED:#B0681E; --a-GO:#9B3F6B; --a-PREV:#5A6B2E;
  --shadow:0 1px 2px rgba(19,32,29,.06),0 4px 16px rgba(19,32,29,.05);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1412; --surface:#151F1C; --surface-2:#1A2622; --line:#2A3834; --line-2:#22302C;
    --ink:#E4ECE9; --ink-2:#C0CDC8; --muted:#8B9B96;
    --accent:#6CC3A6; --accent-ink:#0B1A15; --accent-soft:#1D3830;
    --iodine:#E0A456; --iodine-soft:#3A2B18;
    --good:#6BCB93; --good-soft:#193426; --warn:#E3B54E; --warn-soft:#352B12; --crit:#F08077; --crit-soft:#3B1D1B;
    --a-CIR:#6CC3A6; --a-CM:#86A6E6; --a-PED:#E7A461; --a-GO:#E08AB5; --a-PREV:#AFC26E;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
    --bg:#0D1412; --surface:#151F1C; --surface-2:#1A2622; --line:#2A3834; --line-2:#22302C;
    --ink:#E4ECE9; --ink-2:#C0CDC8; --muted:#8B9B96;
    --accent:#6CC3A6; --accent-ink:#0B1A15; --accent-soft:#1D3830;
    --iodine:#E0A456; --iodine-soft:#3A2B18;
    --good:#6BCB93; --good-soft:#193426; --warn:#E3B54E; --warn-soft:#352B12; --crit:#F08077; --crit-soft:#3B1D1B;
    --a-CIR:#6CC3A6; --a-CM:#86A6E6; --a-PED:#E7A461; --a-GO:#E08AB5; --a-PREV:#AFC26E;
    --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:26px;line-height:1.15}
h2{font-size:18px}
h3{font-size:15px}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}

/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:18px;overflow-y:auto}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 8px}
.brand b{font-family:var(--display);font-size:20px;letter-spacing:-.02em}
.brand span{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface-2)}
.nav a.on{background:var(--accent-soft);color:var(--ink)}
.nav a .k{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:auto}
.nav svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rail .count{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2)}
.countrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12.5px}
.countrow b{font-family:var(--mono);font-size:15px}
.sync{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;padding:0 8px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--good)} .dot.warn{background:var(--warn)}
main{padding-inline:28px;padding-block:24px 60px;min-width:0}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.pagehead p{margin:4px 0 0;color:var(--muted)}
.topbar,.tabbar{display:none}

/* blocks */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-today{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.lift{box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.plain{background:transparent;border:0;padding:0}
.hero{background:var(--accent);color:var(--accent-ink);border:0}
.hero .muted,.hero .eyebrow{color:inherit;opacity:.78}
.hero .chip{background:rgba(255,255,255,.14);color:inherit;border-color:transparent}
:root[data-theme="dark"] .hero .chip{background:rgba(0,0,0,.14)}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line-2);min-width:0}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .s{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.stripe{width:4px;align-self:stretch;border-radius:2px;flex:none;background:var(--line)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
.kv div{display:flex;flex-direction:column;gap:1px;padding:10px;border-radius:8px;background:var(--surface-2)}
.hero .kv div{background:rgba(255,255,255,.1)}
.kv b{font-family:var(--mono);font-size:19px;font-weight:500}
.kv span{font-size:11.5px;color:var(--muted)}
.hero .kv span{color:inherit;opacity:.78}
.bigd{font-family:var(--display);font-size:44px;line-height:1;font-weight:700;letter-spacing:-.03em}
.meter{height:6px;border-radius:3px;background:var(--line-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px}
.hero .meter{background:rgba(255,255,255,.2)} .hero .meter i{background:currentColor}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.crit{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.chip.io{background:var(--iodine-soft);color:var(--iodine);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.area-tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}

/* buttons & forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.io{background:var(--iodine);border-color:var(--iodine);color:#fff}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--crit)}
.btn.big{padding:13px 22px;font-size:15px;letter-spacing:.04em}
.hero .btn.big{background:var(--accent-ink);color:var(--accent);border-color:transparent}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--iodine);outline-offset:2px}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 12px}
.form .wide{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--ink-2);min-width:0}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:14px;min-width:0}
textarea{min-height:64px;resize:vertical}
input[type=number]{font-family:var(--mono)}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inline input[type=number]{width:78px}
.check{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:6px 11px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line-2);vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--surface-2);position:sticky;top:0;white-space:nowrap;cursor:default}
th.sort{cursor:pointer}
tr:last-child td{border-bottom:0}
td.n{font-family:var(--mono);text-align:right;white-space:nowrap}
tr.hl td{background:var(--iodine-soft)}
td input[type=number]{width:58px;padding:4px 6px}
td select{padding:4px 6px;font-size:12.5px;width:auto}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cal .dh{background:var(--surface-2);padding:6px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center}
.cal .d{background:var(--surface);min-height:112px;padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .d.out{background:var(--surface-2);opacity:.55}
.cal .d.study{background:linear-gradient(var(--accent-soft),var(--accent-soft)) top/100% 3px no-repeat,var(--surface)}
.cal .d.today{outline:2px solid var(--iodine);outline-offset:-2px}
.cal .d.over{background:var(--accent-soft)}
.cal .dn{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:12px;color:var(--muted)}
.cal .dn button{border:0;background:none;cursor:pointer;color:var(--muted);font-size:15px;line-height:1;padding:0 3px}
.it{font-size:11.5px;line-height:1.25;padding:3px 5px;border-radius:5px;background:var(--surface-2);border-left:3px solid var(--line);cursor:pointer;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.it[draggable=true]{cursor:grab}
.it.done{text-decoration:line-through;opacity:.55}
.it.t-revisao{border-left-color:var(--iodine)}
.it.t-simulado{border-left-color:var(--a-CM)}
.it.t-prova{border-left-color:var(--crit);background:var(--crit-soft);color:var(--crit);font-weight:700}
.it.rv{background:transparent;border:1px dashed var(--iodine);border-left-width:3px;color:var(--iodine);cursor:default}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* steps */
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps button{flex:1 1 130px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.steps button b{font-size:13px}
.steps button span{font-size:11.5px;color:var(--muted)}
.steps button.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.steps button.ok b::after{content:" ✓";color:var(--good)}
.timer{font-family:var(--mono);font-size:30px;font-weight:500;letter-spacing:-.02em}

/* bars / charts */
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:120px minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:13px}
.bar .track{position:relative;height:14px;background:var(--line-2);border-radius:3px}
.bar .track i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.bar .track u{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--muted);opacity:.6}
.bar .v{font-family:var(--mono);text-align:right;font-size:12.5px}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-family:var(--mono);font-size:13px}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);font-size:13px}
.note{font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:10px 12px;border:1px solid var(--line-2)}
.note.warn{background:var(--warn-soft);border-color:transparent;color:var(--ink)}
.banner{font-size:12.5px;padding:8px 12px;border-radius:8px;background:var(--warn-soft);color:var(--ink)}
details.tree{border-top:1px solid var(--line-2)}
details.tree summary{cursor:pointer;padding:9px 2px;font-weight:600;display:flex;gap:8px;align-items:center;list-style:none}
details.tree summary::-webkit-details-marker{display:none}
details.tree summary::before{content:"▸";color:var(--muted);transition:transform .15s}
details.tree[open] summary::before{transform:rotate(90deg)}

/* dialog + toast */
.sheet-bg{position:fixed;inset:0;background:rgba(10,18,16,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.sheet{background:var(--surface);border-radius:14px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.more-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.more-grid a{padding:12px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink);font-weight:600;display:flex;gap:8px;align-items:center}
.more-grid svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}

/* v2 */
.todos{display:flex;flex-direction:column;gap:10px}
.todo{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid rgba(255,255,255,.16)}
.todo-n{font-family:var(--display);font-size:22px;line-height:1;min-width:20px;opacity:.9}
.linkrow,.linkrow3{display:block;width:100%;text-align:left;background:none;border:0;padding:4px 0;color:inherit;cursor:pointer;font-size:15px;font-weight:600;text-decoration:none}
.linkrow:hover{text-decoration:underline}
.linkrow2{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px;font-weight:600}
.hero .btn.ghost{color:inherit}
.done{text-decoration:line-through;opacity:.6}
.hero .btn.big.alt{background:transparent;color:inherit;border:1px solid currentColor}
.tone{font-size:14px;align-self:center}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink-2);font-weight:600}
.rowbtns{flex-wrap:nowrap}
details.revsec summary{display:flex;align-items:center;gap:10px;cursor:pointer;list-style:none}
details.revsec summary::-webkit-details-marker{display:none}
.rates{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.rate{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font-weight:600;font-size:12px;color:var(--ink)}
.rate span{font-size:20px}
.rate:hover{border-color:var(--accent);background:var(--accent-soft)}
.menu{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mi{display:flex;align-items:center;gap:8px;padding:11px 12px;background:var(--surface);border:0;border-top:1px solid var(--line-2);text-align:left;cursor:pointer;font-weight:600;color:var(--ink);text-decoration:none;font-size:14px}
.mi:first-child{border-top:0}
button.mi:hover,a.mi:hover{background:var(--surface-2)}
.mi.danger{color:var(--crit)}
.mi-form{cursor:default;flex-wrap:wrap}
.mi-form span{flex:1 1 140px}
.mi-form input{width:auto;flex:0 1 150px}
.facts{grid-template-columns:repeat(auto-fit,minmax(100px,1fr))}
.facts b{font-size:15px}
.progwrap>summary{cursor:pointer;font-weight:600;padding:4px 0;color:var(--ink-2)}
.prog{display:flex;flex-direction:column;gap:8px;padding-top:6px}
.prog+.prog{border-top:1px solid var(--line-2);padding-top:12px}
.cal .it.more{border:0;background:none;color:var(--accent);font-weight:600;text-align:left;cursor:pointer;width:100%}
.cal .it.rv.late{border-color:var(--crit);color:var(--crit)}
.cal .it.rv{cursor:pointer}
.cal .d.past .it{opacity:.75}
.cal .dnum{font-family:var(--mono);font-size:12px!important;color:var(--muted)}
.weekgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.daycard.is-today,.lday.is-today{box-shadow:inset 3px 0 0 var(--iodine)}
.dlist{display:flex;flex-direction:column;gap:2px;min-width:0}
.drow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px solid var(--line-2);font-size:13.5px;overflow-wrap:anywhere}
.drow:first-child{border-top:0}
.linkrow3{font-size:13.5px;font-weight:500}
.linkrow3.late{color:var(--crit)}
.lmonth{font-size:13px;letter-spacing:.12em;color:var(--muted);padding-top:10px}
.lday{display:grid;grid-template-columns:74px minmax(0,1fr);gap:10px;padding:8px 0 8px 6px;border-top:1px solid var(--line-2)}
.ldate{display:flex;flex-direction:column;align-items:flex-start;background:none;border:0;padding:4px 0;cursor:pointer;color:var(--ink);text-align:left}

const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>iso(new Date());
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+Math.round(n));return iso(d)};

function saveTopics(list){
  const old=Object.fromEntries(topics().map(t=>[t.id,t])), t0=now();
  const next=list.map(t=>{const o=old[t.id]; if(o&&JSON.stringify({...o,u:0})===JSON.stringify({...t,u:0})) return o; return {...t,u:t0};});
  const keep=new Set(next.map(t=>t.id));
  for(const id in old) if(!keep.has(id)) S.del.topics[id]=t0;
  for(const t of next) delete S.del.topics[t.id];
  S.topics=next; changed(); render();
}

/* ---- mesclagem registro a registro (o mais recente vence; exclusões viram marcas) ---- */
function mergeMaps(a={},b={},da={},db={}){
  const out={}, dels={...da};
  for(const [k,v] of Object.entries(db)) dels[k]=Math.max(dels[k]||0,v);
  for(const id of new Set([...Object.keys(a),...Object.keys(b)])){
    const x=a[id], y=b[id]; const r=!x?y:!y?x:((y.u||0)>(x.u||0)?y:x);
    if(dels[id]&&dels[id]>=(r.u||0)) continue;
    out[id]=r; delete dels[id];
  }
  return {items:out,dels};
}
function mergeState(A,B){
  const R={app:'rota-r1',v:2,del:{}};
  const ca=A.config?.u||0, cb=B.config?.u||0; R.config=cb>ca?B.config:(A.config||B.config);
  for(const c of COLS){ const m=mergeMaps(A[c],B[c],A.del?.[c],B.del?.[c]); R[c]=m.items; R.del[c]=m.dels; }
  const ta=Object.fromEntries((A.topics||[]).map(t=>[t.id,t])), tb=Object.fromEntries((B.topics||[]).map(t=>[t.id,t]));
  const m=mergeMaps(ta,tb,A.del?.topics,B.del?.topics); R.del.topics=m.dels;
  const order=[...(A.topics||[]),...(B.topics||[])].map(t=>t.id);
  R.topics=[...new Set(order)].filter(id=>m.items[id]).map(id=>m.items[id]);
  if(!R.topics.length) R.topics=A.topics||B.topics||[];
  // limpa marcas de exclusão com mais de 90 dias
  const lim=now()-90*864e5; for(const c in R.del) for(const [k,v] of Object.entries(R.del[c])) if(v<lim) delete R.del[c][k];
  return R;
}

/* ---- sincronização com Gist privado ---- */
const Sync={

  store(){ try{ if(this.cfg) localStorage.setItem(SKEY,JSON.stringify(this.cfg)); else localStorage.removeItem(SKEY) }catch(e){} },
  on(){ return !!(this.cfg&&this.cfg.token&&this.cfg.gistId) },
  async api(path,opt={}){
    const r=await fetch('https://api.github.com'+path,{...opt,cache:'no-store',headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+this.cfg.token,'X-GitHub-Api-Version':'2022-11-28',...(opt.body?{'Content-Type':'application/json'}:{})}});
    if(r.status===401) throw new Error('Token inválido ou expirado');
    if(r.status===403||r.status===429) throw new Error('GitHub recusou (limite ou permissão do token)');
    if(r.status===404) throw new Error('Gist não encontrado');
    if(!r.ok) throw new Error('GitHub respondeu '+r.status);
    return r.json();
  },
  async readRemote(){
    const g=await this.api('/gists/'+this.cfg.gistId);
    const f=g.files&&g.files[GFILE]; if(!f) return null;
    let txt=f.content;
    if(f.truncated){ const r=await fetch(f.raw_url,{cache:'no-store'}); txt=await r.text(); }
    try{ return JSON.parse(txt) }catch(e){ return null }
  },
  async connect(token){
    this.cfg={token}; setSync('','Conectando ao GitHub…');
    try{
      const user=await this.api('/user'); this.cfg.login=user.login;
      let found=null;
      for(let page=1;page<=5&&!found;page++){
        const list=await this.api('/gists?per_page=100&page='+page);
        found=list.find(g=>g.files&&g.files[GFILE]); if(list.length<100) break;
      }
      if(found){ this.cfg.gistId=found.id; }
      else{
        const g=await this.api('/gists',{method:'POST',body:JSON.stringify({description:'Checklist da aprovação — dados do dashboard de estudos (não apagar)',public:false,files:{[GFILE]:{content:JSON.stringify(snapshot())}}})});
        this.cfg.gistId=g.id;
      }
      this.store(); await this.run(true); return found?'found':'created';
    }catch(e){ this.cfg=null; this.store(); setSync('warn',e.message); throw e; }
  },
  disconnect(){ this.cfg=null; this.store(); this.err=null; setSync('warn','Sincronização desligada'); render(); },
  schedule(){ if(!this.on()) return; clearTimeout(this.timer); setSync('','Alterações a enviar…'); this.timer=setTimeout(()=>this.run(),800); },
  async run(initial=false){
    if(!this.on()) return;
    if(this.busy){ this.again=true; return; }
    this.busy=true; clearTimeout(this.timer);
    try{
      setSync('','Sincronizando…');
      const remote=await this.readRemote();
      const local=snapshot();
      const merged=remote?mergeState(local,remote):local;
      const mj=JSON.stringify(merged), rj=remote?JSON.stringify(remote):'';
      const localChanged=JSON.stringify(local)!==mj;
      if(localChanged){ applyData(merged); if(!S.config) S.config=mergeCfg(null); if(!S.topics||!S.topics.length) S.topics=seedTopics(); saveLocal(); }
      if(mj!==rj){ await this.api('/gists/'+this.cfg.gistId,{method:'PATCH',body:JSON.stringify({files:{[GFILE]:{content:mj}}})}); }
      this.last=new Date(); this.err=null;
      setSync('ok','Sincronizado às '+pad(this.last.getHours())+':'+pad(this.last.getMinutes()));
      if(localChanged||initial) render();
    }catch(e){ this.err=e.message; setSync('warn','Falha na sincronização: '+e.message); }
    finally{ this.busy=false; if(this.again){ this.again=false; this.run(); } }
  }
};

/* ============ CÁLCULOS ============ */
function allStats(){
  const st={};
  const g=id=>st[id]||(st[id]={q:0,c:0,last:null,min:0,hist:[]});
  for(const s of Object.values(S.sessions)){ if(!s.topicId) continue; const o=g(s.topicId); o.q+=+s.q||0; o.c+=+s.c||0; o.min+=+s.min||0; if(!o.last||s.date>o.last)o.last=s.date; o.hist.push(s); }
  for(const sm of Object.values(S.sims)){ for(const r of sm.rows||[]){ if(!r.topicId) continue; const o=g(r.topicId); o.q+=+r.q||0; o.c+=Math.max(0,(+r.q||0)-(+r.e||0)); if(!o.last||sm.date>o.last)o.last=sm.date; } }
  for(const o of Object.values(st)) o.hist.sort((a,b)=>a.date<b.date?-1:1);
  return st;
}
function openErrorsBy(){const m={};for(const e of Object.values(S.errors)){if(!e.done)m[e.topicId]=(m[e.topicId]||0)+1}return m}
function activeExams(){return cfg().exams.filter(e=>e.active).sort((a,b)=>a.date<b.date?-1:1)}
function nextExam(){const t=today();return activeExams().find(e=>e.date>=t)||null}
function phaseInfo(){
  const ne=nextExam(); if(!ne) return {key:'inicial',label:'Sem prova ativa',days:null};
  const d=diff(today(),ne.date), p=cfg().phase;
  if(d<=p.final) return {key:'final',label:'Reta final',days:d,desc:'Questões + provas anteriores + caderno de erros + revisão de temas prioritários.'};
  if(d<=p.initial) return {key:'intermediaria',label:'Fase intermediária',days:d,desc:'Mais questões + revisões. Teoria só para corrigir erros.'};
  return {key:'inicial',label:'Fase inicial',days:d,desc:'Mais conteúdo + questões. Cobrir os temas de maior incidência.'};
}
function areaWeights(){
  const ex=activeExams().filter(e=>e.date>=today()); const w={CIR:0,CM:0,PED:0,GO:0,PREV:0}; let tot=0;
  ex.forEach(e=>{const f=1/Math.max(1,+e.prio||1); const sum=Object.values(e.weights).reduce((a,b)=>a+(+b||0),0)||100;
    for(const a in w) w[a]+=f*((+e.weights[a]||0)/sum*5); tot+=f;});
  for(const a in w) w[a]= tot? w[a]/tot : 1;   // 1 = peso médio
  return w;
}

   (https://www.medway.com.br/conteudos/residencia-medica-scm-rp/), consultado em 16/09/2026 */
const EXAM_RANK_CIR={

  'Hérnias|Hérnias inguinais e femorais':4,'Hérnias|Hérnias ventrais e umbilicais':4,
  'Trauma|Atendimento inicial (xABCDE / ATLS)':5,

  'Perioperatório|Avaliação de risco pré-operatório':10,'Perioperatório|Preparo pré-op (jejum, medicações, profilaxias)':10,
};
const PW={inicial:{inc:26,imp:12,perf:18,rec:10,due:12,vol:16,err:6},intermediaria:{inc:28,imp:10,perf:22,rec:8,due:16,vol:8,err:8},final:{inc:30,imp:8,perf:24,rec:6,due:16,vol:4,err:12}};
function topicStatus(t,s){
  if(t.status) return t.status;
  const T=today(), th=cfg().thr, acc=s&&s.q?s.c/s.q*100:null;
  if(!s||!s.q){ if(t.stage==null&&!t.lastStudy) return 'Não iniciado'; if(t.next&&t.next<=T) return 'Revisar'; return (t.stage||0)>=3?'Consolidando':'Em estudo'; }
  if(t.next&&t.next<=T) return 'Revisar';
  if(acc!=null&&acc<th.low) return 'Em estudo';
  if((t.stage||0)>=3&&acc>=th.high&&s.q>=30) return 'Dominado';
  if((t.stage||0)>=2) return 'Consolidando';
  return 'Em estudo';
}
function computeQueue(){
  const T=today(), st=allStats(), oe=openErrorsBy(), ph=phaseInfo(), W=PW[ph.key], aw=areaWeights(), th=cfg().thr;
  return topics().map(t=>{
    const s=st[t.id]||{q:0,c:0,last:null}; const acc=s.q?s.c/s.q:null;
    const inc=t.inc/5, imp=t.imp/5;
    const perf= s.q>=5 ? (1-acc) : (s.q>0?0.6:0.7);
    const lastTouch=[s.last,t.lastRev,t.lastStudy].filter(Boolean).sort().pop();
    const rec= lastTouch? Math.min(diff(lastTouch,T),45)/45 : 1;
    const revn= t.stage!=null? Math.max(0,1-(t.revCount||0)/4) : 0;
    const overdue= t.next&&t.next<=T ? (0.5+Math.min(diff(t.next,T),14)/28) : 0;
    const vol=Math.max(0,1-s.q/40);
    const err=Math.min(oe[t.id]||0,5)/5;
    let sc=W.inc*inc+W.imp*imp+W.perf*perf+W.rec*rec+W.due*overdue+W.vol*vol+W.err*err+4*revn;
    if(t.examRank) sc+=(11-t.examRank)*1.3;
    sc*= 0.7+0.3*Math.min(Math.max(aw[t.area]??1,0),2);
    if(ph.key==='final'&&t.inc>=4) sc*=1.08;
    const status=topicStatus(t,s);
    if(status==='Dominado'&&!overdue) sc*=0.6;
    const dom=topicDomain(t,s);
    if(dom.k==='red') sc*=1.12; else if(dom.k==='green'&&!overdue) sc*=0.85; else if(dom.k==='unval') sc*=1.05;
    sc+= (+t.boost||0)*6;
    const reasons=[];
    if(overdue) reasons.push(t.next<T?'revisão atrasada':'revisão hoje');
    if(s.q>=5&&acc*100<th.low) reasons.push('desempenho baixo');
    if(!s.q) reasons.push(t.stage==null&&!t.lastStudy?'ainda não estudado':'sem questões registradas');
    if(t.stage!=null&&(t.revCount||0)<2&&!overdue) reasons.push('poucas revisões');
    if(oe[t.id]) reasons.push(oe[t.id]+' erro(s) no caderno');
    if(t.inc>=5) reasons.push('alta incidência');
    if(t.examRank) reasons.push('#'+t.examRank+' mais cobrado na SCM-RP');
    return {t,s,acc:acc==null?null:acc*100,score:Math.round(Math.max(0,Math.min(sc,100))),status,reasons,errs:oe[t.id]||0,dom};
  }).sort((a,b)=>b.score-a.score);
}
function perfClass(p){const th=cfg().thr; if(p==null) return ['','—']; if(p<th.low) return ['crit','Prioridade alta']; if(p<th.high) return ['warn','Atenção']; return ['good','Bom domínio']}
function isStudyDay(s){return cfg().studyDays.includes(pd(s).getDay())}
function nextStudyDay(from){let d=from;for(let i=0;i<14;i++){if(isStudyDay(d))return d;d=addD(d,1)}return from}
function studyDaysAhead(n){const out=[];let d=today();for(let i=0;i<n;i++){if(isStudyDay(d))out.push(d);d=addD(d,1)}return out}
function dueErrors(){const T=today();return Object.entries(S.errors).filter(([,e])=>!e.done&&e.next&&e.next<=T).map(([id,e])=>({id,...e})).sort((a,b)=>a.next<b.next?-1:1)}

function addError(o){
  const T=today(); const id=uid();
  put('errors',id,{...o,date:o.date||T,stage:0,next:addD(T,cfg().intervals[0]),done:false,hits:0});

function reviewError(id,ok){
  const e=S.errors[id]; if(!e) return; const T=today(), iv=cfg().intervals;
  if(ok){ const st=(e.stage||0)+1; if(st>=iv.length) put('errors',id,{...e,stage:st,done:true,next:null,hits:(e.hits||0)+1,lastRev:T});
          else put('errors',id,{...e,stage:st,next:addD(T,iv[st]),hits:(e.hits||0)+1,lastRev:T}); }
  else { put('errors',id,{...e,stage:0,next:addD(T,iv[0]),hits:0,lastRev:T,relapses:(e.relapses||0)+1});
         const t=topicById(e.topicId); if(t&&(!t.next||t.next>addD(T,1))) updTopic(t.id,{next:addD(T,1)}); }
}

/* ---- plano automático ---- */
function planFor(date){return Object.entries(S.plan).filter(([,p])=>p.date===date).map(([id,p])=>({id,...p}))}
function maintenance(){
  const T=today();
  // 1) tarefas não feitas em dias passados → próxima sessão disponível
  const nd=nextStudyDay(T);
  for(const [id,p] of Object.entries(S.plan)){
    if(!p.done&&p.date<T&&p.type!=='prova') put('plan',id,{...p,date:nd,pinned:true,movedFrom:p.movedFrom||p.date});
  }
  regenPlan();
}
function regenPlan(){
  const T=today(), c=cfg(); const last=activeExams().filter(e=>e.date>=T).pop();
  const days=studyDaysAhead(Math.min(130,Math.max(14,last?diff(T,last.date)+1:14)));
  const q=computeQueue().filter(x=>x.status!=='Dominado'&&x.t.stage==null&&!x.t.lastStudy);
  const fixed=Object.entries(S.plan).filter(([,p])=>p.date>=T&&(!p.auto||p.pinned||p.done||p.date===T));
  const usedTopics=new Set(fixed.map(([,p])=>p.topicId).filter(Boolean));
  const want=new Map();
  for(const d of days){
    const already=fixed.filter(([,p])=>p.date===d&&p.type!=='revisao').length;
    const n=Math.max(0,c.topicsPerSession-already);
    const dayAreas=new Set(fixed.filter(([,p])=>p.date===d&&p.topicId).map(([,p])=>topicById(p.topicId)?.area));
    const shares=n===1?[1]:n===2?[.6,.4]:Array(n).fill(1/n);
    for(let k=0;k<n;k++){
      const cand=q.filter(x=>!usedTopics.has(x.t.id));
      if(!cand.length) break;
      const it=cand.slice(0,15).find(x=>!dayAreas.has(x.t.area))||cand[0]; usedTopics.add(it.t.id); dayAreas.add(it.t.area);
      const id='a-'+d+'-'+it.t.id;
      want.set(id,{date:d,type:'questoes',topicId:it.t.id,q:Math.max(5,Math.round(c.qPerSession*shares[k]/5)*5),auto:true,done:false,score:it.score});
    }
  }
  for(const [id,p] of Object.entries(S.plan)){
    if(p.auto&&!p.pinned&&!p.done&&p.date>T&&!want.has(id)) del('plan',id);
  }
  for(const [id,p] of want){
    const cur=S.plan[id];
    if(cur&&cur.pinned) continue; // nunca sobrescreve alteração manual (troca/mudança), mesmo com id de auto-geração coincidente
    if(!cur||cur.q!==p.q||cur.topicId!==p.topicId) put('plan',id,p);
  }
}

function weekStats(){
  const T=today(), ws=weekStart(T), we=addD(ws,6);
  const ss=Object.values(S.sessions).filter(s=>s.date>=ws&&s.date<=we);
  const days=new Set(ss.map(s=>s.date)).size;
  const q=ss.reduce((a,s)=>a+(+s.q||0),0), c=ss.reduce((a,s)=>a+(+s.c||0),0), min=ss.reduce((a,s)=>a+(+s.min||0),0);
  const revs=ss.filter(s=>s.kind==='revisao').length+Object.values(S.errors).filter(e=>e.lastRev&&e.lastRev>=ws&&e.lastRev<=we).length;
  const planned=Object.values(S.plan).filter(p=>p.date>=ws&&p.date<=we&&p.type!=='prova').reduce((a,p)=>a+(+p.q||0),0);
  const target=cfg().studyDays.length;
  return {days,target,q,c,acc:pct(c,q),min,revs,planned:Math.max(planned,target*cfg().qPerSession)};
}
function globalStats(){
  let q=0,c=0; Object.values(S.sessions).forEach(s=>{q+=+s.q||0;c+=+s.c||0}); Object.values(S.sims).forEach(s=>{q+=+s.q||0;c+=+s.c||0});
  const st=allStats(); const studied=topics().filter(t=>st[t.id]||t.stage!=null||t.lastStudy).length;
  return {q,c,acc:pct(c,q),studied,total:topics().length};
}
const hm=min=>{min=Math.round(min||0);return Math.floor(min/60)+'h'+pad(min%60)};

/* ---- Matriz de prioridades ---- */
function motivoFor(x){
  // reordena por relevância só para exibição (não altera o cálculo do score nem os dados)
  const inc=x.reasons.filter(r=>/incidência|mais cobrado/.test(r));
  const rest=x.reasons.filter(r=>!/incidência|mais cobrado/.test(r));
  const picked=[...inc,...rest].slice(0,3);
  if(!picked.length) return '—';
  const s=picked.join(' + ');
  return s.charAt(0).toUpperCase()+s.slice(1);
}
function acaoFor(x){
  if(x.status==='Não iniciado') return 'Estudar';
  if(x.errs>=2) return 'Revisar erros';
  if(x.dom&&x.dom.k==='unval') return 'Revisão rápida';
  if(x.status==='Revisar') return 'Revisão rápida';
  if((x.dom&&x.dom.k==='red')||(x.acc!=null&&x.acc<cfg().thr.low)) return 'Fazer questões';
  if(x.status==='Dominado') return 'Manter';
  if(!x.s.q) return 'Estudar';
  return 'Fazer questões';
}

/* ---- Desempenho ---- */
function weeklySeries(n){
  const T=today(); let ws=weekStart(T); const out=[];
  for(let i=n-1;i>=0;i--){const s=addD(ws,-7*i), e=addD(s,6); let q=0,c=0;
    Object.values(S.sessions).forEach(x=>{if(x.date>=s&&x.date<=e){q+=+x.q||0;c+=+x.c||0}});
    Object.values(S.sims).forEach(x=>{if(x.date>=s&&x.date<=e){q+=+x.q||0;c+=+x.c||0}});
    out.push({label:fmt(s),q,c,acc:pct(c,q)});}
  return out;
}
function comboChart(data){
  const W=640,H=240,L=40,R=44,Tp=14,B=30, iw=W-L-R, ih=H-Tp-B;
  const qmax=Math.max(10,...data.map(d=>d.q)); const nice=Math.ceil(qmax/10)*10;
  const bw=iw/data.length*.56; const th=cfg().thr;
  const x=i=>L+iw/data.length*(i+.5), yq=v=>Tp+ih-(v/nice)*ih, ya=v=>Tp+ih-(v/100)*ih;
  let g='';
  [0,.5,1].forEach(f=>{const y=Tp+ih-f*ih; g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line-2)"/><text x="${L-6}" y="${y+3}" text-anchor="end">${Math.round(nice*f)}</text><text x="${W-R+6}" y="${y+3}">${Math.round(100*f)}%</text>`});
  g+=`<line x1="${L}" x2="${W-R}" y1="${ya(th.high)}" y2="${ya(th.high)}" stroke="var(--good)" stroke-dasharray="3 4" opacity=".6"/>`;
  g+=`<line x1="${L}" x2="${W-R}" y1="${ya(th.low)}" y2="${ya(th.low)}" stroke="var(--crit)" stroke-dasharray="3 4" opacity=".6"/>`;
  data.forEach((d,i)=>{ if(d.q) g+=`<rect x="${x(i)-bw/2}" y="${yq(d.q)}" width="${bw}" height="${Tp+ih-yq(d.q)}" rx="2" fill="var(--accent)" opacity=".28"><title>${d.label}: ${d.q} questões</title></rect>`;
    if(i%2===(data.length-1)%2) g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${d.label}</text>`;});
  const pts=data.map((d,i)=>d.acc==null?null:[x(i),ya(d.acc)]).filter(Boolean);
  if(pts.length>1) g+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--iodine)" stroke-width="2"/>`;
  pts.forEach((p,i)=>{g+=`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?4:2.5}" fill="var(--iodine)"/>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Questões por semana e percentual de acerto">${g}</svg>`;
}
VIEWS.desempenho=()=>{
  const gs=globalStats(), st=allStats(), th=cfg().thr;
  const area={}; AREAS.forEach(a=>area[a.id]={q:0,c:0});
  topics().forEach(t=>{const s=st[t.id];if(s){area[t.area].q+=s.q;area[t.area].c+=s.c}});
  const rows=topics().map(t=>({t,s:st[t.id]||{q:0,c:0}})).filter(x=>x.s.q>0);
  const weak=rows.filter(x=>x.s.c/x.s.q*100<th.high).sort((a,b)=>(b.s.q-b.s.c)-(a.s.q-a.s.c)).slice(0,8);
  const strong=rows.filter(x=>x.s.q>=10&&x.s.c/x.s.q*100>=th.low).sort((a,b)=>b.s.c/b.s.q-a.s.c/a.s.q).slice(0,8);
  const wk=weeklySeries(12);
  const months={}; [...Object.values(S.sessions),...Object.values(S.sims)].forEach(x=>{const k=x.date.slice(0,7);(months[k]=months[k]||{q:0,c:0});months[k].q+=+x.q||0;months[k].c+=+x.c||0});
  const mk=Object.keys(months).sort().slice(-6);
  const qmaxM=Math.max(1,...mk.map(k=>months[k].q));
  return `<div class="pagehead"><div><span class="eyebrow">Mapa de desempenho</span><h1>Desempenho</h1><p>Faixas: abaixo de ${th.low}% prioridade alta · ${th.low}–${th.high-1}% atenção · ${th.high}%+ bom domínio.</p></div></div>
  <div class="kv"><div><b>${gs.q}</b><span>questões totais</span></div><div><b>${gs.acc==null?'—':gs.acc+'%'}</b><span>acerto geral</span></div><div><b>${gs.q-gs.c}</b><span>erros totais</span></div><div><b>${gs.studied}/${gs.total}</b><span>temas com questões</span></div><div><b>${Object.keys(S.sims).length}</b><span>simulados</span></div></div>
  <div class="grid g2">
    <section class="card"><h2>Por área</h2><div class="bars">${AREAS.map(a=>{const v=area[a.id];const p=pct(v.c,v.q);const [k]=perfClass(p);
      return `<div class="bar"><span>${a.short}</span><span class="track"><i style="width:${p||0}%;background:${k?`var(--${k})`:'var(--line)'}"></i><u style="left:${th.low}%"></u><u style="left:${th.high}%"></u></span><span class="v">${p==null?'—':p+'%'} · ${v.q}q</span></div>`}).join('')}</div></section>
    <section class="card"><div class="card-h"><h2>Evolução semanal</h2><span class="small muted"><span style="color:var(--accent)">■</span> questões · <span style="color:var(--iodine)">●</span> % acerto</span></div>${gs.q?comboChart(wk):'<div class="empty">O gráfico aparece quando você registrar questões.</div>'}</section>
    <section class="card"><h2>Assuntos mais errados</h2>${weak.length?`<div class="list">${weak.map(x=>`<div class="row">${stripe(x.t.area)}<div class="grow"><div class="t">${esc(x.t.sub)}</div><div class="s num">${x.s.q-x.s.c} erros em ${x.s.q}</div></div>${accChip(pct(x.s.c,x.s.q))}</div>`).join('')}</div>`:'<div class="empty">Sem dados ainda.</div>'}</section>
    <section class="card"><h2>Assuntos mais fortes</h2>${strong.length?`<div class="list">${strong.map(x=>`<div class="row">${stripe(x.t.area)}<div class="grow"><div class="t">${esc(x.t.sub)}</div><div class="s num">${x.s.c}/${x.s.q}</div></div>${accChip(pct(x.s.c,x.s.q))}</div>`).join('')}</div>`:'<div class="empty">Aparecem temas com 10+ questões e acerto acima de '+th.low+'%.</div>'}</section>
    <section class="card"><h2>Evolução mensal</h2>${mk.length?`<div class="bars">${mk.map(k=>{const v=months[k];return `<div class="bar"><span>${MES[+k.slice(5)-1].slice(0,3)}/${k.slice(2,4)}</span><span class="track"><i style="width:${v.q/qmaxM*100}%;background:var(--accent);opacity:.5"></i></span><span class="v">${v.q}q · ${pct(v.c,v.q)}%</span></div>`}).join('')}</div>`:'<div class="empty">Sem dados ainda.</div>'}</section>
    <section class="card"><h2>Por tema</h2><div class="tbl-wrap" style="max-height:340px;overflow:auto"><table><thead><tr><th>Tema</th><th>Q</th><th>%</th></tr></thead><tbody>${rows.sort((a,b)=>a.s.c/a.s.q-b.s.c/b.s.q).map(x=>`<tr><td>${areaTag(x.t.area)} ${esc(x.t.sub)}</td><td class="n">${x.s.q}</td><td>${accChip(pct(x.s.c,x.s.q))}</td></tr>`).join('')||'<tr><td colspan="3" class="muted">Sem dados ainda.</td></tr>'}</tbody></table></div></section>
  </div>`;
};

const val=id=>{const el=document.getElementById(id);return el?el.value.trim():''};
const num=id=>{const v=val(id);return v===''?null:Number(v)};
function readOnlyGuard(){ return false }

const ACT={
  more(){ sheet(`<div class="card-h"><h2>Mais</h2><button class="btn sm ghost" data-act="close">Fechar</button></div><div class="more-grid">${ROUTES.filter(r=>!['hoje','revisoes','questoes','agenda'].includes(r[0])).map(([k,l])=>`<a href="#${k}" data-act="close-nav">${svgI(k)}${l}</a>`).join('')}</div><div class="sync" id="syncline2"><span class="dot ${syncState[0]}"></span>${esc(syncState[1])}</div>`) },
  close(){closeSheet()}, 'close-nav'(){closeSheet(); return 'nav'},
  'close-bg'(el,ev){ if(ev.target===el) closeSheet() },
  'toggle-theme'(){ const t=getTheme(); setTheme(t==='auto'?'dark':t==='dark'?'light':'auto'); render() },
  'save-q'(el){
    if(readOnlyGuard()) return; const px=el.dataset.px;
    const topicId=val(px+'-topic'), q=num(px+'-q'), c=num(px+'-c');
    if(!topicId) return toast('Escolha o tema.');
    if(!q||q<1) return toast('Informe quantas questões fez.');
    if(c==null||c<0||c>q) return toast('Acertos deve ficar entre 0 e '+q+'.');
    const o={topicId,exam:val(px+'-exam'),q,c,min:0,diff:val(px+'-diff'),obs:val(px+'-obs'),date:val(px+'-date')||today(),kind:'estudo'};
    const t=topicById(topicId);
    if(t&&t.next&&t.next<=o.date) registerReview({...o,rating:null}); else registerSession(o);
    clearForm([px+'-q',px+'-c',px+'-obs',px+'-diff']);
    const p=Math.round(c/q*100); const [k,l]=perfClass(p);
    toast(`Registrado: ${p}% — ${l}. ${q-c} erro(s) para o caderno.`);
    render();
  },
  'save-err'(el){
    if(readOnlyGuard()) return; const px=el.dataset.px; const topicId=val(px+'-topic');
    if(!topicId) return toast('Escolha o tema do erro.');
    const o={topicId,exam:val(px+'-exam'),questao:val(px+'-questao'),motivo:val(px+'-motivo'),conceito:val(px+'-conceito'),pegadinha:val(px+'-pegadinha'),nota:val(px+'-nota'),date:val(px+'-date')||today()};
    addError(o);
    clearForm([px+'-questao',px+'-conceito',px+'-pegadinha',px+'-nota']);
    toast('Erro adicionado. Revisão em '+fmtL(addD(today(),cfg().intervals[0]))+'.'); render();
  },
  'err-ok'(el){ if(readOnlyGuard()) return; reviewError(el.dataset.id,true); toast('Boa. Intervalo aumentado.') },
  'err-bad'(el){ if(readOnlyGuard()) return; reviewError(el.dataset.id,false); toast('Volta para D+1. Revisão do tema antecipada.') },
  errf(el){ UI.errF=el.dataset.f; render() },
  del(el){ if(readOnlyGuard()) return; if(!confirmInline(el)) return; del(el.dataset.col,el.dataset.id); toast('Excluído.') },
  areaf(el){ UI.areaF=el.dataset.a; render() },
  seven(){ UI.sevenDays=!UI.sevenDays; render() },
  cal(el){ const d=+el.dataset.d; if(!d){UI.calMonth=null}else{const b=pd((UI.calMonth||today().slice(0,7))+'-01'); b.setMonth(b.getMonth()+d); UI.calMonth=iso(b).slice(0,7)} render() },
  regen(){ if(readOnlyGuard()) return; regenPlan(); toast('Plano recalculado pelas prioridades atuais.') },
  'item-done'(el){ const p=S.plan[el.dataset.id]; if(!p) return; put('plan',el.dataset.id,{...p,done:!p.done,pinned:true}); closeSheet() },
  'item-del'(el){ const p=S.plan[el.dataset.id]; if(!p) return; if(p.auto){ put('plan',el.dataset.id,{...p,done:true,pinned:true,skipped:true}) } else del('plan',el.dataset.id); closeSheet(); toast('Removido do dia.') },
  'add-topic'(){ const tema=val('nt-tema'), sub=val('nt-sub'), area=val('nt-area'); if(!tema||!sub) return toast('Preencha tema e subtema.');
    const id=area+'-'+hash(tema+'|'+sub); if(topicById(id)) return toast('Esse subtema já existe.');
    saveTopics([...topics(),{id,area,tema,sub,inc:Math.min(5,Math.max(1,num('nt-inc')||3)),imp:Math.min(5,Math.max(1,num('nt-imp')||3)),src:'U',stage:null,next:null,mult:1,streak:0,status:'',boost:0}]);
    clearForm(['nt-tema','nt-sub']); toast('Tema adicionado.') },
  'del-topic'(el){ if(!confirmInline(el)) return; saveTopics(topics().filter(t=>t.id!==el.dataset.id)); toast('Tema removido. Registros antigos continuam no histórico.') },
  'restore-topics'(){ const have=new Set(topics().map(t=>t.id)); const add=seedTopics().filter(t=>!have.has(t.id)); if(!add.length) return toast('Todos os temas-padrão já estão no banco.'); saveTopics([...topics(),...add]); toast(add.length+' tema(s) restaurado(s).') },
  'sim-addrow'(){ UI.simRows.push({id:uid()}); render() },
  'sim-delrow'(el){ UI.simRows=UI.simRows.filter(r=>r.id!==el.dataset.id); if(!UI.simRows.length) UI.simRows=[{id:uid()}]; render() },
  'save-sim'(){
    if(readOnlyGuard()) return; const q=num('sm-q'), c=num('sm-c');
    if(!q) return toast('Informe o número de questões.'); if(c==null||c<0||c>q) return toast('Acertos deve ficar entre 0 e '+q+'.');
    const rows=UI.simRows.map(r=>({topicId:val('sr-t-'+r.id),q:num('sr-q-'+r.id)||0,e:num('sr-e-'+r.id)||0})).filter(r=>r.topicId&&(r.e>0||r.q>0)).map(r=>({...r,q:Math.max(r.q,r.e)}));
    const exam=val('sm-exam'), date=val('sm-date')||today();
    put('sims',uid(),{exam,ano:val('sm-ano'),q,c,min:num('sm-min')||0,date,rows});
    const T=today();
    rows.filter(r=>r.e>0).forEach(r=>{
      addError({topicId:r.topicId,exam,questao:`Simulado ${examName(exam)} ${val('sm-ano')} — ${r.e} erro(s)`,motivo:'',conceito:'',pegadinha:'',nota:'Gerado pelo simulado: revise as questões erradas e defina o motivo.',date});
      const t=topicById(r.topicId); if(t) updTopic(t.id,{next:addD(T,1),stage:t.stage==null?0:Math.max(0,(t.stage||0)-1),streak:0,mult:1});
    });
    ['sm-ano','sm-q','sm-c','sm-min'].forEach(id=>clearForm([id])); UI.simRows=[{id:uid()}];
    regenPlan(); toast(`Simulado salvo: ${Math.round(c/q*100)}%. ${rows.filter(r=>r.e>0).length} tema(s) com revisão antecipada.`); render();
  },
  'save-cfg'(){
    if(readOnlyGuard()) return; const c=structuredClone(cfg());

const RATINGS=[{k:0,ico:'🔴',label:'Esqueci'},{k:1,ico:'🟠',label:'Difícil'},{k:2,ico:'🟡',label:'Parcial'},{k:3,ico:'🟢',label:'Lembrei bem'},{k:4,ico:'🔵',label:'Dominei'}];

/* ---- migração segura v1 → v2 (intervalos D+1/7/30/60 → D+1/7/14/30/60/90) ---- */
function migrate(){
  if(!cfg().days123) saveConfig({...cfg(),studyDays:[1,2,3],days123:true}); // pedido: estudar seg/ter/qua
  if(!cfg().examRankV1){ // pedido: ranking real dos temas mais cobrados na SCM-RP (Medway)

    saveConfig({...cfg(),examRankV1:true});
  }
  const c=cfg(); if((c.v||1)>=2) return;
  const oldIv=JSON.stringify(c.intervals)==='[1,7,30,60]';
  const map=k=>k==null||k<=1?k:k+1;
  const nc={...c,v:2,revShare:c.revShare??25,minPerQ:c.minPerQ??2,revQ:c.revQ||{low:15,mid:10,high:5}};
  if(oldIv) nc.intervals=[1,7,14,30,60,90];
  saveConfig(nc);
  const st=allStats();
  saveTopics(topics().map(t=>{let x=t; if(oldIv&&t.stage!=null) x={...x,stage:map(t.stage)}; if(!x.lastStudy&&st[t.id]?.last) x={...x,lastStudy:st[t.id].last}; return x;}));
  if(oldIv) for(const [id,e] of Object.entries(S.errors)) if(!e.done&&e.stage>=2) put('errors',id,{...e,stage:map(e.stage)});
}

/* ---- motor de revisão ---- */
const ivAt=k=>{const iv=cfg().intervals;return iv[Math.min(Math.max(k||0,0),iv.length-1)]};
const accLevel=p=>p==null?null:p<60?0:p<70?1:p<90?3:4;
function combineLevel(r,p){const a=accLevel(p); if(r==null||r==='') return a; r=+r; return a==null?r:Math.round(a*0.65+r*0.35)}
function scheduleFirst(D){ const T=today(); let next=addD(D,ivAt(0)); if(next<T) next=T; return {stage:0,streak:0,mult:1,ivDays:ivAt(0),next}; }
function scheduleReview(t,level,D){
  const n=cfg().intervals.length; let stage=t.stage??0, streak=t.streak||0, mult=t.mult||1, days;
  if(level===0){ stage=0; streak=0; mult=1; days=t.inc>=4?1:2; }
  else if(level===1){ stage=Math.max(0,stage-1); streak=0; mult=1; days=Math.min(Math.max(2,Math.round(ivAt(stage)/2)),5); }
  else if(level===2){ streak=0; days=Math.min(ivAt(stage),14); }
  else { stage+=1;
    if(level===4){ streak+=1; if(streak>=2) mult=Math.min(+(mult*1.3).toFixed(2),3); } else streak=0;
    days=Math.round(ivAt(stage)*((level===4||stage>=n)?mult:1)); }
  return {stage,streak,mult,ivDays:days,next:addD(D,days),lastRev:(!t.lastRev||D>t.lastRev)?D:t.lastRev,revCount:(t.revCount||0)+1,lastRating:level};
}
function markPlanDone(topicId,D,onlyType){
  for(const [pid,p] of Object.entries(S.plan)) if(p.topicId===topicId&&!p.done&&p.date<=today()&&(!onlyType||p.type===onlyType)) put('plan',pid,{...p,done:true,doneOn:D});
}
function registerSession(o){

  put('sessions',id,{...o,date:D,ts:Date.now()});

  if(t){

    if(o.approx) patch.lastStudyApprox=o.approx; else if(patch.lastStudy===D) patch.lastStudyApprox=null;
    if(t.stage==null||!t.next) Object.assign(patch,scheduleFirst(D));
    else if(p!=null&&p<cfg().thr.low){ let soon=addD(D,1); if(soon<today()) soon=today(); if(t.next>soon) Object.assign(patch,{next:soon,ivDays:1,stage:t.inc>=4?0:Math.max(0,(t.stage||0)-1),streak:0,mult:1}); }
    updTopic(t.id,patch);
  }
  markPlanDone(o.topicId,D,null);
  return id;
}
function registerReview(o){
  const t=topicById(o.topicId); if(!t) return null;
  const D=o.date||today(), p=o.q>0?o.c/o.q*100:null, level=combineLevel(o.rating,p);
  if(level==null) return null;
  put('sessions',uid(),{topicId:t.id,exam:o.exam||nextExam()?.id||'',q:o.q||0,c:o.c||0,min:o.min||0,diff:o.diff||'',obs:o.obs||'',kind:'revisao',rating:level,ivBefore:t.ivDays||null,date:D,ts:Date.now()});
  const patch={...scheduleReview(t,level,D),lastRevAcc:p==null?null:Math.round(p)};
  updTopic(t.id,patch); markPlanDone(t.id,D,'revisao');
  if(level!=null&&level<=1){ const soon=addD(D,1)<today()?today():addD(D,1);
    for(const [eid,e] of Object.entries(S.errors)) if(!e.done&&e.topicId===t.id&&(!e.next||e.next>soon)) put('errors',eid,{...e,next:soon}); }
  return patch;
}
const reviewLabel=t=>t.stage==null&&!t.next?'':'D+'+(t.ivDays??ivAt(t.stage));
function suggestQ(acc){const r=cfg().revQ,th=cfg().thr; return acc==null?r.mid:acc<th.low?r.low:acc<th.high?r.mid:r.high}
function revItems(){
  const T=today(), st=allStats(), oe=openErrorsBy(), th=cfg().thr;
  return topics().filter(t=>t.next).map(t=>{
    const s=st[t.id]||{q:0,c:0}; const acc=t.lastRevAcc??pct(s.c,s.q); const late=diff(t.next,T);
    const consol=(t.stage||0)>=3&&((t.lastRating??0)>=3||(acc!=null&&acc>=th.high));
    const cat=late>0?'atrasada':late===0?'hoje':consol?'consolidada':'proxima';
    const prio=t.inc*12+(acc==null?15:(100-acc)*.3)+Math.min(Math.max(late,0),30)*.8+((t.stage||0)<3?8:0)+t.imp*2+(oe[t.id]?5:0);
    return {t,s,acc,late,cat,prio,q:suggestQ(acc),label:reviewLabel(t),errs:oe[t.id]||0,dom:topicDomain(t,s)};
  });
}
function dueReviews(){return revItems().filter(x=>x.late>=0).sort((a,b)=>b.prio-a.prio)}
function reviewBudgetQ(){const c=cfg(),b=c.blocks; return Math.max(5,Math.round((b.rev+b.q+b.corr)*(c.revShare??25)/100/(c.minPerQ||2)))}
function reviewPlanToday(){
  const due=dueReviews(), budget=reviewBudgetQ(), pick=[]; let used=0;
  for(const r of due){ if(pick.length&&used+r.q>budget) continue; pick.push(r); used+=r.q; }
  return {pick,rest:due.filter(r=>!pick.includes(r)),budget,used};
}
const revTone=r=>r.late>0||(r.acc!=null&&r.acc<cfg().thr.low)?'🔴':(r.acc==null||r.acc<cfg().thr.high)?'🟡':'🟢';
function lastStudyText(t,s){ if(t.lastStudyApprox) return '~'+approxLabel(t.lastStudyApprox); const d=[t.lastStudy,s?.last].filter(Boolean).sort().pop(); return d?fmt(d):'—'; }

/* ---- semáforo de domínio (temas + validação de estudos anteriores) ---- */
const DOM_TH={low:70,high:85};
function topicDomain(t,s){
  s=s||{hist:[]};
  const hist=s.hist||[];
  const real=hist.filter(h=>h.kind!=='retro'&&h.q>0);
  if(!real.length){
    if(hist.some(h=>h.kind==='retro')) return {k:'unval',ico:'⚪',label:'Retenção não validada'};
    return {k:'none',ico:'',label:t.stage==null&&!t.lastStudy?'Não iniciado':'Em estudo'};
  }
  const last=real.slice(-4);
  let tw=0,sum=0; last.forEach((h,i)=>{const w=i+1,a=h.q?h.c/h.q*100:null; if(a==null)return; sum+=a*w; tw+=w;});
  let acc=tw?sum/tw:null;
  if(acc!=null&&t.lastRevAcc!=null) acc=acc*0.6+t.lastRevAcc*0.4;
  const oe=openErrorsBy()[t.id]||0;
  if(oe>=3&&acc!=null&&acc>=DOM_TH.low) acc=DOM_TH.low-1;
  if(acc==null) return {k:'none',ico:'',label:'Em estudo'};
  const k=acc<DOM_TH.low?'red':acc<DOM_TH.high?'yellow':'green';
  return {k,ico:k==='red'?'🔴':k==='yellow'?'🟡':'🟢',label:k==='red'?'Fraco':k==='yellow'?'Em consolidação':'Bom domínio',acc:Math.round(acc)};
}
function domChip(d){ if(!d||!d.k||d.k==='none') return '<span class="chip">—</span>';
  const cls=d.k==='red'?'crit':d.k==='yellow'?'warn':d.k==='green'?'good':'';
  return `<span class="chip ${cls}">${d.ico?d.ico+' ':''}${esc(d.label)}</span>`; }

/* ---- progresso até a prova ---- */
function examProgress(e){
  const T=today(), c=cfg(); let sessions=0; for(let d=T;d<e.date;d=addD(d,1)) if(isStudyDay(d)) sessions++;
  const pend=topics().filter(t=>t.inc>=4&&t.stage==null&&!t.lastStudy).length;
  let revs=0; for(const t of topics()){ if(!t.next) continue; let d=t.next<T?T:t.next, k=t.stage||0, g=0; while(d<e.date&&g<20){ revs++; g++; k++; d=addD(d,ivAt(k)); } }
  const sims=Object.values(S.plan).filter(p=>p.type==='simulado'&&p.date>=T&&p.date<=e.date).length;
  const goal=sessions*(c.qPerSession+reviewBudgetQ());
  return {days:diff(T,e.date),sessions,pend,revs,sims,goal,fits:sessions*c.topicsPerSession>=pend};
}

/* ---- HOJE: maior oportunidade, cobertura, desempenho recente, reincidências (reaproveita Matriz de Prioridades) ---- */
function topOpportunity(items,rp){
  // usa a mesma ordenação da Matriz de Prioridades (computeQueue) — o tema #1 de lá é a maior oportunidade
  const x=computeQueue()[0]; if(!x) return null;
  const acao=acaoFor(x);
  const revQ=rp.pick.find(r=>r.t.id===x.t.id)?.q;
  const planQ=items.find(p=>p.topicId===x.t.id&&!p.done)?.q;
  const qty=acao==='Revisar erros'?x.errs:(revQ??planQ??cfg().qPerSession);
  return {x,acao,qty,motivo:motivoFor(x)};
}
function coverageFor(e){
  const st=allStats(); const buckets={alta:{c:0,t:0},media:{c:0,t:0},baixa:{c:0,t:0}}; let wsum=0,wcov=0;
  topics().forEach(t=>{
    const started=topicStatus(t,st[t.id])!=='Não iniciado';
    const tier=t.inc>=4?'alta':t.inc===3?'media':'baixa';
    buckets[tier].t++; if(started) buckets[tier].c++;
    const w=t.inc*((+e.weights[t.area]||20)); wsum+=w; if(started) wcov+=w;
  });
  return {pct:wsum?Math.round(wcov/wsum*100):0,buckets};
}
function recentAccuracy(){
  const recs=[];
  for(const s of Object.values(S.sessions)) if(s.q) recs.push({date:s.date,ts:s.ts||0,q:+s.q||0,c:+s.c||0});
  for(const sm of Object.values(S.sims)) for(const r of sm.rows||[]) if(r.topicId&&r.q) recs.push({date:sm.date,ts:0,q:+r.q||0,c:Math.max(0,(+r.q||0)-(+r.e||0))});
  recs.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.ts-b.ts);
  const wAcc=rs=>{let q=0,c=0;rs.forEach(r=>{q+=r.q;c+=r.c});return q?Math.round(c/q*100):null;};
  let i=recs.length-1,qsum=0,cur=[]; while(i>=0&&qsum<300){cur.push(recs[i]);qsum+=recs[i].q;i--;}
  let qsum2=0,prev=[]; while(i>=0&&qsum2<300){prev.push(recs[i]);qsum2+=recs[i].q;i--;}
  const accCur=wAcc(cur), accPrev=wAcc(prev);
  let trend='→'; if(accCur!=null&&accPrev!=null){ if(accCur>accPrev+3) trend='↑'; else if(accCur<accPrev-3) trend='↓'; }
  return {acc:accCur,trend};
}
function reincidentTopics(){
  const byTopic={};
  for(const e of Object.values(S.errors)){ if(!e.topicId) continue;
    const g=byTopic[e.topicId]=byTopic[e.topicId]||{relapses:0,open:0};
    if(!e.done) g.open++; g.relapses+=(e.relapses||0); }
  const out=[];
  for(const [tid,g] of Object.entries(byTopic)) if(g.relapses>0||g.open>=2){ const t=topicById(tid); if(t) out.push({t,score:g.relapses+g.open}); }
  return out.sort((a,b)=>b.score-a.score);
}

  'swap-do'(el){ swapPlan(el.dataset.a,el.dataset.b); closeSheet(); },
  'change-pick'(el){
    const id=el.dataset.id, p=S.plan[id];
    sheet(`${sheetHead('✏️ Alterar tema',`Substituir “${esc(tName(topicById(p.topicId)))}”`,`${fmtL(p.date)} · o tema atual continua no banco e volta para a fila se estiver pendente`)}
      <label class="f">Novo tema<select id="ch-topic">${topicOptions('')}</select></label>
      <div class="btns"><button class="btn pri" data-act="change-do" data-id="${id}">Alterar</button></div>`);
  },
  'change-do'(el){ const p=S.plan[el.dataset.id], nt=val('ch-topic'); if(!p) return; if(!nt) return toast('Escolha o novo tema.');
    put('plan',el.dataset.id,{...p,topicId:nt,title:'',pinned:true,done:false}); closeSheet(); regenPlan(); toast('Tema alterado para '+tName(topicById(nt))+'.'); },
  day(el){
    const d=el.dataset.date, RV=reviewsByDay(), EX={}; activeExams().forEach(e=>{(EX[e.date]=EX[e.date]||[]).push(e)});
    const en=dayEntries(d,RV,EX);
    sheet(`${sheetHead(isStudyDay(d)?'Dia de estudo':'Dia',`${WDL[pd(d).getDay()]}, ${fmt(d)}`)}
      ${en.length?`<div class="dlist">${en.map(x=>`<div class="drow">${x.row}</div>`).join('')}</div>`:'<div class="empty">Nada programado.</div>'}
      <div class="btns">${[['estudo','📚 Estudo'],['revisao','🔁 Revisão'],['questoes','❓ Questões'],['simulado','📝 Simulado']].map(([k,l])=>`<button class="btn sm" data-act="add-item" data-date="${d}" data-type="${k}">+ ${l}</button>`).join('')}</div>`);
  },
  'add-item'(el){
    const d=el.dataset.date, ty=el.dataset.type||'questoes';
    sheet(`${sheetHead('Adicionar em '+fmtL(d),`${TYPE_ICO[ty]} ${PLAN_TYPES[ty]}`)}
      <div class="form"><label class="f wide">Tema<select id="ai-topic">${topicOptions('',true).replace('Escolha o tema…',ty==='simulado'?'Sem tema (simulado)':'Escolha o tema…')}</select></label>
      ${ty==='revisao'?'<p class="small muted wide">A revisão do tema passa a ser nesse dia (o histórico e a curva são mantidos).</p>':`<label class="f">Questões<input type="number" id="ai-q" value="${ty==='simulado'?100:20}"></label><label class="f">Descrição (opcional)<input type="text" id="ai-title" placeholder="${ty==='simulado'?'Prova SCMRP 2024':''}"></label>`}</div>
      <input type="hidden" id="ai-type" value="${ty}">
      <div class="btns"><button class="btn pri" data-act="add-item-save" data-date="${d}">Adicionar</button></div>`);
  },
  'add-item-save'(el){ const d=el.dataset.date, ty=val('ai-type'), topicId=val('ai-topic'), title=val('ai-title');
    if(ty==='revisao'){ if(!topicId) return toast('Escolha o tema da revisão.'); const t=topicById(topicId); updTopic(topicId,{next:d,stage:t.stage??0,ivDays:t.ivDays??ivAt(0)}); closeSheet(); return toast('Revisão marcada para '+fmtL(d)); }
    if(!topicId&&!title) return toast('Escolha um tema ou escreva uma descrição.');
    put('plan',uid(),{date:d,type:ty,topicId,title,q:num('ai-q')||0,done:false,auto:false}); closeSheet(); regenPlan(); toast('Adicionado.') },
  'rev-topic'(el){ const t=topicById(el.dataset.id); if(!t) return;
    sheet(`${sheetHead('🔁 Revisão '+esc(reviewLabel(t)),esc(t.sub),`${esc(AREA[t.area].name)} → ${esc(t.tema)}`)}${topicFacts(t)}
      <div class="btns"><button class="btn pri" data-act="rev-open" data-id="${t.id}">Registrar revisão</button><button class="btn" data-act="rev-move" data-id="${t.id}">Remarcar</button></div>`); },
  'rev-open'(el){
    const t=topicById(el.dataset.id); if(!t) return; const x=revItems().find(r=>r.t.id===t.id)||{q:suggestQ(null),acc:null,label:'',dom:topicDomain(t,allStats()[t.id])};
    const unval=x.dom&&x.dom.k==='unval';
    const pend=Object.values(S.errors).filter(e=>e.topicId===t.id&&!e.done).length;
    sheet(`${sheetHead(unval?'Validar retenção':'Revisão — '+esc(t.sub),unval?esc(t.sub):'Como foi essa revisão?',unval?`${esc(AREA[t.area].short)} · tema estudado antes do dashboard, retenção ainda não validada`:`${esc(AREA[t.area].short)} · ${esc(x.label)} · último desempenho ${x.acc==null?'—':x.acc+'%'}`)}
      <div class="note">${unval?`Responda <b>10–15 questões</b> para validar quanto você ainda domina deste tema.`:`Sugestão: <b>${x.q} questões</b> → revise os erros${pend?` (<a href="#erros" data-act="close-nav">${pend} no caderno</a>)`:''} → consulta rápida à teoria só no que errar.`}</div>
      <div class="form"><label class="f">Questões<input type="number" min="0" id="rv-q" placeholder="${x.q}"></label><label class="f">Acertos<input type="number" min="0" id="rv-c"></label><label class="f">Data<input type="date" id="rv-date" value="${today()}"></label></div>
      <div class="small muted" id="rv-calc">Informe questões/acertos e/ou escolha como foi.</div>
      <div class="rates">${RATINGS.map(r=>`<button class="rate" data-act="rev-save" data-id="${t.id}" data-r="${r.k}"><span>${r.ico}</span>${r.label}</button>`).join('')}</div>
      <div class="btns"><button class="btn sm" data-act="rev-save" data-id="${t.id}" data-r="">Salvar só pelo desempenho nas questões</button></div>`);
  },
  'rev-save'(el){
    const q=num('rv-q'), c=num('rv-c'), r=el.dataset.r;
    if(q!=null&&(c==null||c<0||c>q)) return toast('Acertos deve ficar entre 0 e '+q+'.');
    if(r===''&&!q) return toast('Informe as questões ou escolha como foi.');
    const res=registerReview({topicId:el.dataset.id,q:q||0,c:c||0,rating:r===''?null:+r,date:val('rv-date')||today()});
    if(!res) return toast('Informe as questões ou escolha como foi.');
    closeSheet(); toast(`${RATINGS[res.lastRating].ico} Próxima revisão: ${fmtL(res.next)} (D+${res.ivDays})`);
  },
  'rev-move'(el){ const t=topicById(el.dataset.id); if(!t) return;
    sheet(`${sheetHead('Remarcar revisão',esc(t.sub),'Atual: '+(t.next?fmtL(t.next):'—'))}<label class="f">Nova data<input type="date" id="rm-date" value="${nextStudyDay(addD(today(),1))}"></label>
      <div class="btns"><button class="btn pri" data-act="rev-move-do" data-id="${t.id}">Remarcar</button></div>`); },
  'rev-move-do'(el){ const d=val('rm-date'); if(!d) return toast('Escolha a data.'); updTopic(el.dataset.id,{next:d}); closeSheet(); toast('Revisão remarcada para '+fmtL(d)); },
  'exam-date'(el){ const e=cfg().exams.find(x=>x.id===el.dataset.id); if(!e) return;
    sheet(`${sheetHead('🎯 Prova',esc(e.name),e.confirmed?'Data confirmada':'Data da prova não confirmada')}
      <div class="form"><label class="f">Data<input type="date" id="ed-date" value="${e.date}"></label><label class="check"><input type="checkbox" id="ed-conf" ${e.confirmed?'checked':''}> Data confirmada</label></div>
      <div class="btns"><button class="btn pri" data-act="exam-date-save" data-id="${e.id}">Salvar</button></div>`); },
  'exam-date-save'(el){ const d=val('ed-date'); if(!d) return toast('Escolha a data.'); const c=structuredClone(cfg());
    c.exams=c.exams.map(x=>x.id===el.dataset.id?{...x,date:d,confirmed:document.getElementById('ed-conf').checked}:x); saveConfig(c); closeSheet(); regenPlan(); toast('Data da prova atualizada.') },
  'retro-open'(el){
    const m=UI.retroMode=(el&&el.dataset&&el.dataset.mode)||UI.retroMode||'one';
    if(m==='bulk') return retroBulk(m);
    const temas=[...new Set(topics().map(t=>t.tema))], subs=[...new Set(topics().map(t=>t.sub))];
    sheet(`${sheetHead('Estudo anterior ao dashboard','+ Adicionar tema já estudado','Registra no histórico e agenda a revisão pela curva de esquecimento.')}
      <div class="seg" style="align-self:flex-start"><button data-act="retro-open" data-mode="one" class="${m==='one'?'on':''}">Um tema</button><button data-act="retro-open" data-mode="bulk" class="${m==='bulk'?'on':''}">Vários temas</button></div>
      <div class="form">
        <label class="f">Área<select id="rt-area">${AREAS.map(a=>`<option value="${a.id}">${a.short}</option>`).join('')}</select></label>
        <label class="f">Tema<input type="text" id="rt-tema" list="rt-temas" placeholder="Hepatologia"></label>
        <label class="f wide">Subtema<input type="text" id="rt-sub" list="rt-subs" placeholder="Hepatites virais"></label>
        <label class="f" id="rt-date-wrap">Data em que estudei<input type="date" id="rt-date" value="${addD(today(),-1)}" max="${today()}"></label>
        <label class="f" id="rt-approx-wrap" hidden>Quando, aproximadamente?<select id="rt-approx">${APPROX.map(a=>`<option value="${a[0]}">${a[1]}</option>`).join('')}</select></label>
        <label class="check wide"><input type="checkbox" id="rt-nodate"> Não lembro a data exata</label>
        <label class="f">Questões realizadas<input type="number" min="0" id="rt-q"></label>
        <label class="f">Acertos<input type="number" min="0" id="rt-c"></label>
        <div class="f"><span>Erros · % de acertos</span><b class="num" id="rt-calc" style="padding:8px 0">—</b></div>
        <label class="check wide"><input type="checkbox" id="rt-noq"> Não lembro quantas questões fiz</label>
        <label class="f">Dificuldade percebida<select id="rt-diff"><option value="">—</option><option>fácil</option><option>média</option><option>difícil</option></select></label>
        <label class="f wide">Observações<input type="text" id="rt-obs"></label>
      </div>
      <datalist id="rt-temas">${temas.map(x=>`<option value="${esc(x)}">`).join('')}</datalist><datalist id="rt-subs">${subs.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>
      <div class="btns"><button class="btn pri" data-act="retro-save">Salvar estudo anterior</button></div>`);
  },
  'retro-bulk-save'(){
    const sel=[...document.querySelectorAll('.bulk input[data-area]:checked')].map(x=>x.id.slice(3));
    if(!sel.length) return toast('Marque pelo menos um tema.');
    const noD=document.getElementById('rb-nodate').checked; let date,approx=null;
    if(noD){ approx=val('rb-approx'); date=addD(today(),-(APPROX.find(a=>a[0]===approx)[2])); } else { date=val('rb-date'); if(!date||date>today()) return toast('Informe uma data válida ou marque “Não lembro a data exata”.'); }
    for(const id of sel){ const q=num('rbq-'+id), c=num('rbc-'+id); if(q!=null&&(c==null||c<0||c>q)) return toast('Confira os acertos de '+tName(topicById(id))+'.'); }
    for(const id of sel){ const q=num('rbq-'+id), c=num('rbc-'+id);
      registerSession({topicId:id,exam:'',q:q||0,c:c||0,min:0,diff:'',obs:'',date,approx,noQ:q==null?true:undefined,kind:'retro'}); }
    const p=spreadReviews(sel); regenPlan(); closeSheet();
    const ds=Object.values(p).sort(); toast(`${sel.length} tema(s) registrados. Revisões distribuídas${ds.length?` de ${fmt(ds[0])} a ${fmt(ds[ds.length-1])}`:''}.`);
  },
  'retro-save'(){
    const area=val('rt-area'), tema=val('rt-tema'), sub=val('rt-sub'), noQ=document.getElementById('rt-noq').checked, noD=document.getElementById('rt-nodate').checked;
    if(!sub) return toast('Informe o subtema.');
    let q=null,c=null; if(!noQ){ q=num('rt-q'); c=num('rt-c'); if(q==null&&c==null){ return toast('Informe as questões ou marque “Não lembro quantas questões fiz”.'); } if(!q||c==null||c<0||c>q) return toast('Acertos deve ficar entre 0 e o total de questões.'); }
    let date, approx=null; if(noD){ approx=val('rt-approx'); date=addD(today(),-(APPROX.find(a=>a[0]===approx)[2])); } else { date=val('rt-date'); if(!date) return toast('Informe a data ou marque “Não lembro a data exata”.'); if(date>today()) return toast('A data não pode ser futura.'); }
    const norm=s=>s.trim().toLowerCase();
    let t=topics().find(x=>x.area===area&&norm(x.sub)===norm(sub)&&(!tema||norm(x.tema)===norm(tema)))||topics().find(x=>x.area===area&&norm(x.sub)===norm(sub));
    if(!t){ const tm=tema||'Outros'; t={id:area+'-'+hash(tm+'|'+sub),area,tema:tm,sub,inc:3,imp:3,src:'U',stage:null,next:null,mult:1,streak:0,status:'',boost:0}; if(!topicById(t.id)) saveTopics([...topics(),t]); t=topicById(t.id); }
    registerSession({topicId:t.id,exam:'',q:q||0,c:c||0,min:0,diff:val('rt-diff'),obs:val('rt-obs'),date,approx,noQ:noQ||undefined,kind:'retro'});
    if(q&&c/q*100<cfg().thr.low){ const nt=topicById(t.id); if(nt.next>today()) updTopic(t.id,{next:today()}); }
    regenPlan(); closeSheet(); const nt=topicById(t.id);
    toast(`${t.sub}: registrado. Revisão ${nt.next<=today()?'para hoje':'em '+fmtL(nt.next)}.`);
  }
});
function retroBulk(m){
  const st=allStats();
  sheet(`${sheetHead('Estudos anteriores ao dashboard','+ Adicionar temas já estudados','Marque tudo que você já estudou. As revisões são recalculadas e distribuídas nos próximos dias de estudo.')}
    <div class="seg" style="align-self:flex-start"><button data-act="retro-open" data-mode="one" class="${m==='one'?'on':''}">Um tema</button><button data-act="retro-open" data-mode="bulk" class="${m==='bulk'?'on':''}">Vários temas</button></div>
    <div class="form">
      <label class="f" id="rb-date-wrap" hidden>Quando estudei (todos)<input type="date" id="rb-date" value="${addD(today(),-7)}" max="${today()}"></label>
      <label class="f" id="rb-approx-wrap">Aproximadamente<select id="rb-approx">${APPROX.map(a=>`<option value="${a[0]}" ${a[0]==='1-3m'?'selected':''}>${a[1]}</option>`).join('')}</select></label>
      <label class="check"><input type="checkbox" id="rb-nodate" checked> Não lembro a data exata</label>
      <label class="f">Buscar<input type="search" id="rb-search" placeholder="Filtrar temas"></label>
    </div>
    <div class="small muted">Questões e acertos são opcionais — em branco = “não lembro quantas questões fiz”.</div>
    <div class="bulk">${AREAS.map(a=>`<details class="barea" open><summary>${esc(a.short)} <span class="chip" id="rb-count-${a.id}">0</span></summary>
      ${topics().filter(t=>t.area===a.id).map(t=>{const done=t.stage!=null||t.lastStudy||st[t.id];return `<div class="brow" data-s="${esc((t.tema+' '+t.sub).toLowerCase())}">
        <label class="check grow"><input type="checkbox" id="rb-${t.id}" data-area="${a.id}"> <span><b>${esc(t.sub)}</b> <span class="small muted">${esc(t.tema)}${done?' · já registrado':''}</span></span></label>
        <input type="number" min="0" id="rbq-${t.id}" placeholder="qtd" aria-label="Questões"><input type="number" min="0" id="rbc-${t.id}" placeholder="acert." aria-label="Acertos"></div>`}).join('')}</details>`).join('')}</div>
    <div class="small muted">Tema que não está na lista? Use a aba “Um tema”.</div>
    <div class="btns"><button class="btn pri" data-act="retro-bulk-save">Salvar temas marcados</button><span class="small muted" id="rb-total">0 marcados</span></div>`);
}
/* distribui revisões de estudos antigos nos próximos dias de estudo, respeitando o limite diário */
function spreadReviews(ids){
  const T=today(), budget=reviewBudgetQ(), load={};
  const days=studyDaysAhead(90); if(!days.length) return {};
  const first=days[0];
  dueReviews().filter(r=>!ids.includes(r.t.id)).forEach(r=>{load[first]=(load[first]||0)+r.q});
  const items=revItems().filter(r=>ids.includes(r.t.id)&&r.late>=0).sort((a,b)=>b.prio-a.prio);
  const patches={};
  for(const r of items){
    const d=days.find(x=>!load[x]||load[x]+r.q<=budget)||days[days.length-1];
    load[d]=(load[d]||0)+r.q; patches[r.t.id]=d<T?T:d;
  }
  saveTopics(topics().map(t=>patches[t.id]?{...t,next:patches[t.id]}:t));
  return patches;
}
function swapPlan(a,b){
  const A=S.plan[a], B=S.plan[b]; if(!A||!B) return;
  put('plan',a,{...A,date:B.date,pinned:true,movedFrom:null}); put('plan',b,{...B,date:A.date,pinned:true,movedFrom:null});
  toast(`Trocado: ${fmt(B.date)} ↔ ${fmt(A.date)}`);
}
document.addEventListener('change',ev=>{
  const id=ev.target.id;
  if(id==='rb-nodate'){ const on=ev.target.checked; document.getElementById('rb-approx-wrap').hidden=!on; document.getElementById('rb-date-wrap').hidden=on; }
  if(ev.target.dataset&&ev.target.dataset.area){ const a=ev.target.dataset.area; document.getElementById('rb-count-'+a).textContent=document.querySelectorAll(`.bulk input[data-area="${a}"]:checked`).length; document.getElementById('rb-total').textContent=document.querySelectorAll('.bulk input[data-area]:checked').length+' marcados'; }
  if(id==='rt-nodate'){ const on=ev.target.checked; document.getElementById('rt-approx-wrap').hidden=!on; document.getElementById('rt-date-wrap').hidden=on; }
  if(id==='rt-noq'){ const on=ev.target.checked; ['rt-q','rt-c'].forEach(k=>{const e=document.getElementById(k); e.disabled=on; if(on) e.value='';}); document.getElementById('rt-calc').textContent='—'; }
});
document.addEventListener('input',ev=>{
  const id=ev.target.id;
  if(id==='rb-search'){ const q=ev.target.value.toLowerCase().trim(); document.querySelectorAll('.brow').forEach(r=>{r.hidden=!!q&&!r.dataset.s.includes(q)}); }
  if(/^rb[qc]-/.test(id)&&ev.target.value){ const cb=document.getElementById('rb-'+id.slice(4)); if(cb&&!cb.checked){cb.checked=true;cb.dispatchEvent(new Event('change',{bubbles:true}));} }
  if(id==='rt-q'||id==='rt-c'){ const q=num('rt-q'), c=num('rt-c'); document.getElementById('rt-calc').textContent=q&&c!=null&&c<=q?`${q-c} erros · ${Math.round(c/q*100)}%`:'—'; }
  if(id==='rv-q'||id==='rv-c'){ const q=num('rv-q'), c=num('rv-c'); const el=document.getElementById('rv-calc'); if(el) el.textContent=q&&c!=null&&c<=q?`${c}/${q} → ${Math.round(c/q*100)}% · ${RATINGS[accLevel(c/q*100)].ico} sugere “${RATINGS[accLevel(c/q*100)].label}”`:'Informe questões/acertos e/ou escolha como foi.'; }
});
boot();
</script>
