name: Gerar rota de revisão (/api/revisao)

on:
  schedule:
    - cron: '*/15 * * * *'   # a cada 15 minutos
  workflow_dispatch:          # botão "Run workflow" manual no GitHub

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gerar /api/revisao
        run: node scripts/gerar-revisao.js

      - name: Commit se houve mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add api/revisao
          git diff --cached --quiet || git commit -m "chore: atualiza /api/revisao"
          git push
